
{% load static %}

<header class="site-header">
    <div class="container header-inner">

        <button
            class="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-menu"
            aria-label="Open menu"
        >
            <span class="menu-toggle-bars" aria-hidden="true"></span>
        </button>

        <a class="brand" href="{% url 'store:home' %}" aria-label="NICE-STORE home">
            {% include 'partials/logo.html' with logo_class='brand-logo' %}
        </a>

        <div class="site-menu" id="site-menu">
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'store:home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Home</a>

                <a href="{% url 'store:product_list' %}?sort=price_asc"{% if request.resolver_match.url_name == 'product_list' and request.GET.sort != 'newest' and request.GET.sort != '' %} aria-current="page"{% endif %}>Shop</a>

                <a href="{% url 'store:product_list' %}?sort=newest"{% if request.resolver_match.url_name == 'product_list' and request.GET.sort == 'newest' %} aria-current="page"{% endif %}>New Arrivals</a>

                <a href="{% url 'store:home' %}#categories">Categories</a>
            </nav>
        </div>

        <div class="header-actions">
            <form
                class="search-form"
                role="search"
                method="get"
                action="{% url 'store:product_list' %}"
            >
                <label class="visually-hidden" for="header-search">Search products</label>
                <input
                    class="input"
                    id="header-search"
                    type="search"
                    name="q"
                    placeholder="Search"
                    maxlength="100"
                >
                <button class="search-button" type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.8"></circle>
                        <path d="M16 16L21 21"></path>
                    </svg>
                </button>
            </form>

            {% if user.is_authenticated %}
                <a
                    class="header-icon-link"
                    href="{% url 'accounts:profile' %}"
                    aria-label="My account"
                    title="My account"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M4.5 21C4.5 16.8 7.5 14 12 14C16.5 14 19.5 16.8 19.5 21"></path>
                    </svg>
                </a>
            {% else %}
                <a
                    class="header-icon-link"
                    href="{% url 'accounts:login' %}"
                    aria-label="Sign in"
                    title="Sign in"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M4.5 21C4.5 16.8 7.5 14 12 14C16.5 14 19.5 16.8 19.5 21"></path>
                    </svg>
                </a>
            {% endif %}

            <a
                class="header-icon-link cart-link"
                href="{% url 'cart:detail' %}"
                aria-label="Cart, {{ cart_item_count }} items"
                title="Shopping cart"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 4H5L7.5 16.5H19L21 8H6"></path>
                    <circle cx="9" cy="20" r="1"></circle>
                    <circle cx="18" cy="20" r="1"></circle>
                </svg>
                {% if cart_item_count %}
                    <span class="cart-badge" aria-hidden="true">{{ cart_item_count }}</span>
                {% endif %}
            </a>
        </div>
    </div>
</header>
