<p class="announcement">Pay on delivery, or by Vodafone Cash or InstaPay.</p>

<header class="site-header">
    <div class="container header-inner">

        <button class="menu-toggle" type="button" aria-expanded="false"
                aria-controls="site-menu" aria-label="Open menu">
            <span class="menu-toggle-bars" aria-hidden="true"></span>
        </button>

        <a class="brand" href="{% url 'store:home' %}" aria-label="Z-Store home">
            {% include 'partials/logo.html' %}
        </a>

        <div class="site-menu" id="site-menu">
            <nav class="site-nav" aria-label="Main">
                <a href="{% url 'store:product_list' %}"{% if request.resolver_match.url_name == 'product_list' %} aria-current="page"{% endif %}>Shop</a>
                <a href="{% url 'store:home' %}#new-arrivals">New in</a>
                <a href="{% url 'store:home' %}#categories">Categories</a>
            </nav>

            <div class="header-tools">
                <form class="search-form" role="search" method="get" action="{% url 'store:product_list' %}">
                    <label class="visually-hidden" for="header-search">Search products</label>
                    <input class="input" id="header-search" type="search" name="q"
                           placeholder="Search products" maxlength="100">
                    <button class="search-button" type="submit" aria-label="Search">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                            <circle cx="11" cy="11" r="6.5"/>
                            <path d="m16 16 5 5"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

    </div>
</header>
